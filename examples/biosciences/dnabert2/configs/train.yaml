data:
  kmer: -1

lora:
  r: 8
  alpha: 32
  dropout: 0.05
  target_modules:
    - Wqkv

training:
  run_name: dnabert2
  optim: adamw_torch
  model_max_length: 128
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.00003
  weight_decay: 0.01
  num_train_epochs: 5
  max_steps: -1
  fp16: false
  bf16: false
  save_steps: 200
  eval_steps: 200
  warmup_steps: 50
  logging_steps: 100
  save_total_limit: 3
  dataloader_pin_memory: false
  find_unused_parameters: false
  report_to: []
  seed: 42
