deeponet_config:
  datapipe:
    source:
      data_dir: "${ONESCIENCE_DATASETS_DIR}/PDENNEval/pdebench_data/"
      file_name: "1D_CFD_Rand_Eta0.1_Zeta0.1_periodic_Train.hdf5"
    verbose: True
    data:
      name: "1D_Compressible_NS"
      single_file: True
      reduced_resolution: 4
      reduced_resolution_t: 1
      reduced_batch: 1
      initial_step: 1
      test_ratio: 0.1
      seed: 1

    dataloader:
      batch_size: 50
      num_workers: 1
      pin_memory: False

  model:
    name: "DeepONet"
    input_size: 256
    act: "tanh"
    in_channels: 3
    out_channels: 3
    query_dim: 2
    base_model: "MLP"

  training:
    scenario: "1D_Compressible_NS"
    save_name: "1d_CFD"
    training_type: "single"
    if_training: True
    continue_training: False
    model_path: null
    output_dir: "./checkpoint/"
    save_period: 20
    seed: 1
    epochs: 500

    optimizer:
      name: "Adam"
      lr: 1.0e-3
      weight_decay: 1.0e-4

    scheduler:
      name: "StepLR"
      step_size: 100
      gamma: 0.5
